
name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JARFORGE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarforge-release-new.jks"
          test -s "$RUNNER_TEMP/jarforge-release-new.jks"
          chmod 600 "$RUNNER_TEMP/jarforge-release-new.jks"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build signed release APK
        env:
          JARFORGE_KEYSTORE_PATH: ${{ runner.temp }}/jarforge-release-new.jks
          JARFORGE_STORE_PASSWORD: ${{ secrets.JARFORGE_STORE_PASSWORD }}
          JARFORGE_KEY_ALIAS: ${{ secrets.JARFORGE_KEY_ALIAS }}
          JARFORGE_KEY_PASSWORD: ${{ secrets.JARFORGE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: jarforge-ide-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated Gradle wrapper
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          
